# Mandate's own Postgres container (reuses the local postgres:18-alpine image).
services:
  postgres:
    image: postgres:18-alpine
    container_name: mandate-postgres
    environment:
      POSTGRES_USER: mandate
      POSTGRES_PASSWORD: mandate
      POSTGRES_DB: mandate
    ports:
      - "127.0.0.1:5450:5432"
    volumes:
      - mandate-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate -d mandate"]
      interval: 5s
      retries: 10
volumes:
  mandate-pgdata:
